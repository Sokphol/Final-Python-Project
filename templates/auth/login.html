<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in | Watch Shop</title>
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <main class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 border border-slate-200/80">
      <div class="flex items-center justify-between mb-6">
        <a href="{{ url_for('front_bp.home') }}" class="flex items-center gap-2 group">
          <div class="w-8 h-8 bg-slate-950 flex items-center justify-center text-amber-400 rounded-lg">
            <i class="bi bi-watch text-sm"></i>
          </div>
          <span class="font-extrabold text-base text-slate-900">WATCH<span class="text-amber-600">SHOP</span></span>
        </a>
        <a href="{{ url_for('front_bp.home') }}" class="text-xs font-semibold text-slate-400 hover:text-slate-900">
          &larr; Storefront
        </a>
      </div>

      <h1 class="text-2xl font-extrabold text-slate-950 mb-1">Welcome back</h1>
      <p class="text-xs text-slate-500 mb-6">
        Sign in with your admin or customer credentials.
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-xs font-semibold border border-red-200 flex items-center gap-2">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>{{ message }}</span>
          </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Username or email</label>
          <input
            name="identity"
            required
            autofocus
            placeholder="admin or email"
            class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500"
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Password</label>
          <input
            type="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500"
          />
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-slate-600 font-medium">
            <input type="checkbox" name="remember" class="rounded text-slate-900" /> Remember me
          </label>
        </div>
        <button class="w-full bg-slate-950 hover:bg-slate-800 text-white rounded-xl p-3.5 font-bold text-sm shadow-md transition-all">
          Sign In
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
        Default admin login: <span class="font-mono text-slate-600 font-bold">admin</span> / <span class="font-mono text-slate-600 font-bold">admin</span>
      </div>
    </main>
  </body>
</html>
