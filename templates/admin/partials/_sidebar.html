<aside
  class="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col min-h-screen shrink-0 relative z-10"
>
  <div class="flex items-center justify-center h-20 border-b border-gray-100">
    <a
      href="{{ url_for('admin_bp.dashboard') }}"
      class="text-xl font-extrabold tracking-tight text-gray-900 flex items-center gap-2"
    >
      <i class="bi bi-watch text-amber-500 text-2xl"></i>
      <span>Watch<span class="text-slate-400 font-normal">Admin</span></span>
    </a>
  </div>

  <div class="flex-1 overflow-y-auto py-6 px-4">
    <nav class="space-y-8">
      <!-- Main Navigation -->
      <div>
        <div
          class="px-3 mb-2 text-xs font-bold uppercase tracking-widest text-gray-400"
        >
          Overview
        </div>
        <ul class="space-y-1">
          <li>
            <a
              href="{{ url_for('admin_bp.dashboard') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all {% if request.endpoint == 'admin_bp.dashboard' %}bg-gray-100 text-gray-900 shadow-sm{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-grid mr-3 text-lg"></i> Dashboard
            </a>
          </li>
          <li>
            <a
              href="{{ url_for('front_bp.home') }}"
              target="_blank"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium text-amber-700 hover:bg-amber-50 transition-all"
            >
              <i class="bi bi-box-arrow-up-right mr-3 text-base"></i> View Storefront
            </a>
          </li>
        </ul>
      </div>

      <!-- Management -->
      <div>
        <div
          class="px-3 mb-2 text-xs font-bold uppercase tracking-widest text-gray-400"
        >
          E-Commerce Management
        </div>
        <ul class="space-y-1">
          <li>
            <a
              href="{{ url_for('admin_bp.order_list') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-semibold transition-all {% if 'order' in request.endpoint %}bg-slate-900 text-white shadow-sm{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-receipt-cutoff mr-3 text-lg text-amber-400"></i> Customer Orders
            </a>
          </li>
          <li>
            <a
              href="{{ url_for('admin_bp.product') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all {% if 'product' in request.endpoint %}bg-gray-100 text-gray-900 shadow-sm{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-box-seam mr-3 text-lg"></i> Watch Products
            </a>
          </li>
          <li>
            <a
              href="{{ url_for('admin_bp.category') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all {% if request.endpoint == 'admin_bp.category' %}bg-gray-100 text-gray-900 shadow-sm{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-tag mr-3 text-lg"></i> Categories
            </a>
          </li>
          <li>
            <a
              href="{{ url_for('admin_bp.user') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all {% if request.endpoint == 'admin_bp.user' %}bg-gray-100 text-gray-900 shadow-sm{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-people mr-3 text-lg"></i> Users
            </a>
          </li>
          <li>
            <a
              href="{{ url_for('admin_bp.audit_logs') }}"
              class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all {% if request.endpoint == 'admin_bp.audit_logs' %}bg-gray-100 text-gray-900 shadow-sm{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}"
            >
              <i class="bi bi-shield-check mr-3 text-lg"></i> Audit Logs
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- Profile Section Bottom -->
  <div class="p-4 border-t border-gray-100">
    <div
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors"
    >
      <img
        src="https://ui-avatars.com/api/?name={{ current_user.user_name }}&background=000&color=fff"
        class="w-9 h-9 rounded-full object-cover"
      />
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900 truncate">
          {{ current_user.user_name }}
        </p>
        <p class="text-xs text-gray-500 truncate">{{ current_user.email }}</p>
      </div>
    </div>
    <a
      href="{{ url_for('auth.logout') }}"
      class="mt-3 flex items-center px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-red-50 hover:text-red-700 transition-colors"
    >
      <i class="bi bi-box-arrow-right mr-3 text-lg"></i> Logout
    </a>
  </div>
</aside>
