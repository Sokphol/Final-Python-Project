<header class="bg-white border-b border-gray-100 h-20 flex items-center justify-between px-8 sticky top-0 z-40">
  
  <!-- Left Side: Mobile toggle & Breadcrumbs -->
  <div class="flex items-center gap-6">
    <button class="text-gray-400 hover:text-gray-900 md:hidden transition-colors">
      <i class="bi bi-list text-2xl"></i>
    </button>
    
    <div class="hidden md:flex items-center text-sm font-medium text-gray-500">
      <span class="text-gray-900">Admin</span>
      <i class="bi bi-chevron-right mx-3 text-[10px] opacity-50"></i>
      <span>Overview</span>
    </div>
  </div>
  
  <!-- Right Side: Actions -->
  <div class="flex items-center gap-6">
    
    <!-- Minimalist Search -->
    <div class="relative hidden sm:block">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input type="text" placeholder="Search..." class="w-64 pl-10 pr-4 py-2 bg-gray-50 border-transparent rounded-full text-sm focus:bg-white focus:border-gray-200 focus:ring-2 focus:ring-gray-100 transition-all outline-none text-gray-700">
    </div>
    
    <!-- Action Icons -->
    <div class="flex items-center gap-4">
      <a href="/" class="text-gray-400 hover:text-gray-900 transition-colors tooltip relative group" title="View Frontend">
        <i class="bi bi-box-arrow-up-right text-lg"></i>
      </a>
      <button class="text-gray-400 hover:text-gray-900 transition-colors relative">
        <i class="bi bi-bell text-lg"></i>
        <span class="absolute top-0 right-0 w-2 h-2 bg-black rounded-full border border-white"></span>
      </button>
    </div>
    
  </div>
</header>
