<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <!-- Local Compiled Tailwind CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <!-- Bootstrap Icons (still used in templates) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col md:flex-row">
  
  {% include 'admin/partials/_sidebar.html' %}
  
  <div class="flex-1 flex flex-col min-w-0 min-h-screen">
    {% include 'admin/partials/_header.html' %}
    
    <main class="flex-1 p-6">
      {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-white/80 backdrop-blur-md border border-white/20 shadow-lg p-4 border-t border-slate-200 text-sm text-center text-slate-400">
      <strong>Copyright &copy; 2014-2026 <a href="#" class="text-brand-700 hover:underline">Admin</a>.</strong> All rights reserved.
    </footer>
  </div>
</body>
</html>
